<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Particle Heart</title>
  <style>
    :root { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020817;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .wish-modal {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(2, 5, 20, 0.72);
      backdrop-filter: blur(8px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 220ms ease, visibility 220ms ease;
    }
    .wish-modal.open { opacity: 1; visibility: visible; }
    .wish-card {
      position: relative;
      width: min(360px, 100%);
      overflow: hidden;
      border: 1px solid rgba(255, 177, 224, 0.45);
      border-radius: 24px;
      color: #fff2fa;
      text-align: center;
      background: linear-gradient(155deg, #24133d, #10152d 68%, #261333);
      box-shadow: 0 18px 70px rgba(255, 66, 176, 0.28);
      transform: translateY(14px) scale(0.97);
      transition: transform 220ms ease;
    }
    .wish-modal.open .wish-card { transform: translateY(0) scale(1); }
    .wish-close {
      position: absolute;
      z-index: 1;
      top: 11px;
      right: 12px;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 50%;
      color: white;
      background: rgba(9, 8, 27, 0.55);
      font: 24px/1 Arial, sans-serif;
      cursor: pointer;
    }
    .memory-image { display: block; width: 100%; height: 205px; object-fit: cover; background: #160d36; }
    .wish-content { padding: 20px 24px 26px; }
    .wish-content h2 { margin: 0 0 9px; color: #ffb4dc; font: 600 20px Arial, sans-serif; }
    .wish-selected { margin: 0 0 10px; color: #fff; font: 600 17px Arial, sans-serif; }
    .wish-message { margin: 0; color: #e8dcf3; font: 15px/1.6 Arial, sans-serif; }
    @media (prefers-reduced-motion: reduce) {
      .wish-modal, .wish-card { transition: none; }
    }
  </style>
</head>
<body>
  <canvas id="heartCanvas"></canvas>
  <audio id="backgroundMusic" src="music.mp3" preload="auto" loop></audio>
  <div class="wish-modal" id="wishModal" aria-hidden="true">
    <section class="wish-card" role="dialog" aria-modal="true" aria-labelledby="wishTitle">
      <button class="wish-close" id="wishClose" type="button" aria-label="Đóng">×</button>
      <img class="memory-image" src="anh1.jpg" alt="Ảnh kỷ niệm" />
      <div class="wish-content">
        <h2 id="wishTitle">Một lời nhắn dành cho bạn</h2>
        <p class="wish-selected" id="wishSelected"></p>
        <p class="wish-message" id="wishMessage"></p>
      </div>
    </section>
  </div>

  <script>
    const canvas = document.getElementById("heartCanvas");
    const ctx = canvas.getContext("2d");
    const backgroundMusic = document.getElementById("backgroundMusic");
    document.addEventListener("pointerdown", () => {
      backgroundMusic.play().catch(() => {});
    }, { once: true });
    const particles = [];

    // Giảm số lượng hạt vẽ mỗi khung hình để chuyển động ổn định hơn trên điện thoại.
    const PARTICLE_COUNT = 4800;
    const RING_COUNT = 1900;
    const OUTER_RING_COUNT = 900;
    const STAR_COUNT = 350;
    const FRAME_INTERVAL = 1000 / 60;
    let lastFrameTime = 0;

    const stars = Array.from({ length: STAR_COUNT }, () => ({
      x: (Math.random() - 0.5) * 4.8,
      y: (Math.random() - 0.5) * 3.2,
      z: (Math.random() - 0.5) * 4.8,
      radius: 0.38 + Math.random() * 0.72,
      opacity: 0.38 + Math.random() * 0.42,
      phase: Math.random() * Math.PI * 2
    }));
    // Mảng chiếu sao được cấp phát một lần, tái sử dụng mỗi khung hình (tránh GC do tạo mảng mới liên tục)
    const projectedStars = stars.map(star => ({ star, x: 0, y: 0, radius: 0, depth: 0 }));

    let width = 0;
    let height = 0;
    let pixelRatio = 1;
    let build = 0;
    let animationStartTime = null;
    let transitionStartTime = null;
    let cameraYaw = 0;
    let cameraPitch = 0;
    let targetCameraYaw = 0;
    let targetCameraPitch = 0;
    let sphereSpinAngle = 0;
    let sphereZoom = 1;
    let targetSphereZoom = 1;
    let dragPointer = null;
    const activePointers = new Map();
    let pinchStartDistance = 0;
    let pinchStartZoom = 1;
    let wasPinching = false;
    let lastInteractionTime = 0;   // thời điểm tương tác gần nhất, để bật auto-rotate khi rảnh
    const wishHitTargets = [];
    const wishModal = document.getElementById("wishModal");
    const extraWishes = [
      "Mong hôm nay mang đến cho bạn thật nhiều điều dịu dàng.",
      "Dù ngày dài đến đâu, hãy nhớ bạn luôn xứng đáng được yêu thương.",
      "Chúc mỗi ước mơ của bạn đều tìm được đường thành hiện thực.",
      "Mong bạn luôn gặp những người khiến trái tim mình bình yên.",
      "Hãy giữ nụ cười nhé — nó làm thế giới này sáng hơn nhiều.",
      "Chúc bạn có thật nhiều khoảnh khắc nhỏ mà vui thật lâu.",
      "Bạn đặc biệt hơn bạn nghĩ, và được thương nhiều hơn bạn biết.",
      "Mong mọi điều tốt đẹp sẽ nhẹ nhàng tìm đến bên bạn."
    ];

    function openWish(item) {
      const image = document.querySelector(".memory-image");
      const imageCount = 12;
      let attempts = 0;
      let imageIndex = Math.abs(item.index) % imageCount + 1;
      image.onerror = () => {
        attempts++;
        if (attempts >= imageCount) {
          image.onerror = null;
          image.removeAttribute("src");
          return;
        }
        imageIndex = imageIndex % imageCount + 1;
        image.src = `anh${imageIndex}.jpg`;
      };
      image.src = `anh${imageIndex}.jpg`;
      document.getElementById("wishSelected").textContent = item.wish;
      document.getElementById("wishMessage").textContent = extraWishes[
        Math.abs(item.index) % extraWishes.length
      ];
      wishModal.classList.add("open");
      wishModal.setAttribute("aria-hidden", "false");
    }

    function closeWish() {
      wishModal.classList.remove("open");
      wishModal.setAttribute("aria-hidden", "true");
    }

    function ease(t) {
      return t * t * (3 - 2 * t);
    }

    function drawSpaceBackground(time) {
      const background = ctx.createLinearGradient(0, 0, width, height);
      background.addColorStop(0, "#03091b");
      background.addColorStop(0.5, "#080b22");
      background.addColorStop(1, "#020615");
      ctx.fillStyle = background;
      ctx.fillRect(0, 0, width, height);

      const nebulae = [
        { x: 0.18, y: 0.25, radius: 0.42, color: "104, 52, 180" },
        { x: 0.82, y: 0.72, radius: 0.48, color: "28, 75, 170" },
        { x: 0.55, y: 0.08, radius: 0.3, color: "105, 48, 155" }
      ];
      for (const nebula of nebulae) {
        const glow = ctx.createRadialGradient(
          width * nebula.x, height * nebula.y, 0,
          width * nebula.x, height * nebula.y, Math.max(width, height) * nebula.radius
        );
        glow.addColorStop(0, `rgba(${nebula.color}, 0.12)`);
        glow.addColorStop(1, `rgba(${nebula.color}, 0)`);
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, width, height);
      }

      const centerX = width / 2;
      const centerY = height / 2 - height * 0.05;
      const spaceScale = Math.min(width, height);
      const focalLength = spaceScale * 5.2;
      const cosYaw = Math.cos(cameraYaw), sinYaw = Math.sin(cameraYaw);
      const cosPitch = Math.cos(cameraPitch), sinPitch = Math.sin(cameraPitch);
      const viewX = sinYaw * cosPitch;
      const viewY = sinPitch;
      const viewZ = cosYaw * cosPitch;
      const rightX = cosYaw, rightZ = -sinYaw;
      const upX = -sinYaw * sinPitch;
      const upY = cosPitch;
      const upZ = -cosYaw * sinPitch;

      for (let i = 0; i < stars.length; i++) {
        const star = stars[i];
        const worldX = star.x * spaceScale;
        const worldY = star.y * spaceScale;
        const worldZ = star.z * spaceScale;
        const depthOffset = worldX * viewX + worldY * viewY + worldZ * viewZ;
        const depth = focalLength - depthOffset;
        const perspective = focalLength / depth;
        const cameraX = worldX * rightX + worldZ * rightZ;
        const cameraY = worldX * upX + worldY * upY + worldZ * upZ;
        const point = projectedStars[i];
        point.x = centerX + cameraX * perspective;
        point.y = centerY + cameraY * perspective;
        point.radius = star.radius * perspective;
        point.depth = depth;
      }

      // Sao không che khuất nhau đáng kể, nên không cần sắp xếp lại mỗi khung hình.
      for (const point of projectedStars) {
        const star = point.star;
        ctx.globalAlpha = star.opacity * 0.2;
        ctx.fillStyle = "#9ebcff";
        ctx.beginPath();
        ctx.arc(point.x, point.y, point.radius * 3.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = star.opacity;
        ctx.fillStyle = "#e5efff";
        ctx.beginPath();
        ctx.arc(point.x, point.y, point.radius, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

    }

    // Tông tím lavender giữ sắc tím rõ nét khi các hạt cộng sáng.
    const PALETTE = { center: [208, 178, 255], edge: [112, 72, 220] };

    function heart(t) {
      return {
        x: 16 * Math.sin(t) ** 3,
        y: -(13 * Math.cos(t)
          - 5 * Math.cos(2 * t)
          - 2 * Math.cos(3 * t)
          - Math.cos(4 * t))
      };
    }

    function mixColor(amount) {
      const c = PALETTE.center, e = PALETTE.edge;
      return `rgb(${Math.round(c[0] + (e[0] - c[0]) * amount)}, ${Math.round(c[1] + (e[1] - c[1]) * amount)}, ${Math.round(c[2] + (e[2] - c[2]) * amount)})`;
    }

    function sampleHeartPoint() {
      while (true) {
        const angle = Math.random() * Math.PI * 2;
        // Chừa lõi rỗng nhỏ để trái tim có cảm giác viền hạt.
        const depth = 0.22 + Math.pow(Math.random(), 0.18) * 0.78;
        const point = heart(angle);
        const x = point.x * depth;
        const y = point.y * depth;
        const centerBias = Math.abs(x);
        if (Math.random() > Math.min(1, Math.pow(centerBias, 0.85))) continue;
        return { x, y, depth };
      }
    }

    function createParticles() {
      particles.length = 0;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const point = sampleHeartPoint();
        // Vị trí bắt đầu ngẫu nhiên ngoài rìa để bay hội tụ vào hình tim lúc mở trang
        const startAngle = Math.random() * Math.PI * 2;
        const startDist = 60 + Math.random() * 40;
        particles.push({
          x: point.x,
          y: point.y,
          startX: Math.cos(startAngle) * startDist,
          startY: Math.sin(startAngle) * startDist,
          depthMix: point.depth,
          color: mixColor(point.depth),
          radius: 0.03 + point.depth * 0.065,
          opacity: 0.65 + point.depth * 0.35,
          phase: Math.random() * Math.PI * 2,
          speed: 0.006 + Math.random() * 0.01,
          arrive: 0.4 + Math.random() * 0.6 // thời điểm (0..1 của formBuild) hạt này "đến nơi"
        });
      }
    }

    const ringParticles = [];
    const outerRingParticles = [];
    const sphereDecorations = [];
    const sphereWishes = [
      "Luôn hạnh phúc", "Mãi yêu thương", "Bình an nhé", "Luôn mỉm cười",
      "May mắn mỗi ngày", "Mãi bên nhau", "Tràn đầy niềm vui", "Yêu bạn nhiều",
      "Mọi điều như ý", "Ngọt ngào nhé", "Thật nhiều yêu thương", "Hạnh phúc dài lâu",
      "Luôn rạng rỡ", "Ước mơ thành hiện thực", "Ấm áp mỗi ngày", "Thương thật nhiều",
      "Một đời bình yên", "Niềm vui bất tận", "Luôn được chở che", "Mãi lung linh",
      "Ngày mới thật vui", "Luôn gặp điều tốt lành", "Tự tin tỏa sáng", "Bình yên trong tim",
      "Mong bạn luôn được yêu", "Nụ cười luôn nở", "Ước mơ bay cao", "Hạnh phúc quanh đây",
      "Tỏa sáng theo cách riêng", "Thành công rực rỡ", "Mỗi ngày một niềm vui", "Luôn vững tin nhé",
      "Thật nhiều may mắn", "Yêu đời và an yên", "Mong điều lành ghé thăm", "Rạng rỡ mỗi ngày",
      "Luôn có người bên cạnh", "Trái tim ngập nắng", "Vạn điều như ý", "Hạnh phúc nhé bạn"
    ];
    const SPHERE_RADIUS = 72;
    const RING_TILT = 0;
    const RING_SQUASH = 0.2;
    const RING_Y_OFFSET = 4;

    function createRing() {
      ringParticles.length = 0;
      for (let i = 0; i < RING_COUNT; i++) {
        const centerBiasT = Math.pow(Math.random(), 2.2);
        const radius = (18.282 + centerBiasT * 9.898) * 1.3;
        const edgeFade = 1 - centerBiasT;
        ringParticles.push({
          angle0: Math.random() * Math.PI * 2,
          radius,
          size: 0.09 + Math.random() * 0.12,
          opacity: (0.95 + Math.random() * 0.05) * edgeFade,
          color: mixColor(Math.random())
        });
      }
    }

    function createOuterRing() {
      for (let i = 0; i < OUTER_RING_COUNT; i++) {
        const outward = Math.pow(Math.random(), 0.55);
        outerRingParticles.push({
          angle0: Math.random() * Math.PI * 2,
          radius: 42 + outward * 4,
          size: 0.03 + outward * 0.07,
          opacity: 0.55 + outward * 0.45,
          color: mixColor(Math.random())
        });
      }
    }

    function createSphereDecorations() {
      sphereDecorations.length = 0;
      const count = 240;
      const goldenAngle = Math.PI * (3 - Math.sqrt(5));
      for (let i = 0; i < count; i++) {
        const y = 1 - 2 * (i + 0.5) / count;
        const ringRadius = Math.sqrt(1 - y * y);
        const angle = i * goldenAngle;
        const radius = SPHERE_RADIUS * (0.94 + Math.random() * 0.12);
        const isWish = i % 6 === 0;
        const butterfly = !isWish && i % 18 === 2;
        const sparkle = !isWish && i % 18 === 8;
        const heart = !isWish && i % 18 === 14;
        sphereDecorations.push({
          x: Math.cos(angle) * ringRadius * radius,
          y: y * radius,
          z: Math.sin(angle) * ringRadius * radius,
          wish: isWish ? sphereWishes[(i / 6) % sphereWishes.length] : null,
          butterfly,
          sparkle,
          heart,
          phase: Math.random() * Math.PI * 2,
          opacity: 0.72 + Math.random() * 0.28
        });
      }
    }

    function drawButterfly(x, y, size, time, phase) {
      const flap = Math.sin(time * 0.006 + phase) * 0.32;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(size / 16, size / 16);

      for (const side of [-1, 1]) {
        ctx.save();
        ctx.scale(side, 1);
        ctx.scale(0.68, 1.35);
        ctx.rotate(flap);
        const wingGradient = ctx.createLinearGradient(-12, -10, -2, 4);
        wingGradient.addColorStop(0, "#fff0fa");
        wingGradient.addColorStop(0.48, "#ffc2e8");
        wingGradient.addColorStop(1, "#e98acb");
        ctx.fillStyle = wingGradient;
        ctx.strokeStyle = "rgba(255, 235, 250, 0.8)";
        ctx.lineWidth = 0.7;
        ctx.beginPath();
        ctx.moveTo(-0.5, 0);
        ctx.bezierCurveTo(-3, -2.5, -6, -7, -10, -8.5);
        ctx.bezierCurveTo(-15, -9.5, -17, -5, -13, -2.5);
        ctx.bezierCurveTo(-16, 0.5, -12, 3, -7, 2.5);
        ctx.bezierCurveTo(-3, 2.5, -2, 1.5, -0.5, 0);
        ctx.closePath();
        // Một khe nhỏ xuyên qua cánh để nền hiện ra bên trong.
        ctx.ellipse(-9, -4.5, 1.6, 1.1, -0.35, 0, Math.PI * 2);
        ctx.fill("evenodd");
        ctx.stroke();

        // Chút sắc tối tạo chiều sâu mà không làm cánh bị nặng màu.
        ctx.fillStyle = "rgba(57, 34, 72, 0.24)";
        ctx.beginPath();
        ctx.ellipse(-10, -5, 1.7, 1.15, -0.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      ctx.fillStyle = "#48264f";
      ctx.beginPath();
      ctx.ellipse(0, 1, 1.15, 4.2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#48264f";
      ctx.lineWidth = 0.65;
      ctx.beginPath();
      ctx.moveTo(-0.5, -2);
      ctx.quadraticCurveTo(-4, -7, -5, -6);
      ctx.moveTo(0.5, -2);
      ctx.quadraticCurveTo(4, -7, 5, -6);
      ctx.stroke();
      ctx.restore();
    }

    function drawSpherePass(centerX, centerY, scale, visible, time, backPass) {
      if (!backPass) wishHitTargets.length = 0;
      const cosYaw = Math.cos(cameraYaw), sinYaw = Math.sin(cameraYaw);
      const cosPitch = Math.cos(cameraPitch), sinPitch = Math.sin(cameraPitch);
      const cameraDistance = SPHERE_RADIUS * 3.6;
      const projected = [];

      const viewX = sinYaw * cosPitch;
      const viewY = sinPitch;
      const viewZ = cosYaw * cosPitch;
      const rightX = cosYaw, rightZ = -sinYaw;
      const upX = -sinYaw * sinPitch;
      const upY = cosPitch;
      const upZ = -cosYaw * sinPitch;

      const spinCos = Math.cos(sphereSpinAngle);
      const spinSin = Math.sin(sphereSpinAngle);
      // Trục này đưa chữ ở mặt trước chéo lên phía trên bên trái màn hình.
      const axisX = 0.65, axisY = -0.65, axisZ = 0.39;
      for (const item of sphereDecorations) {
        // Quay cả bề mặt theo một trục chéo để các chữ lần lượt đi qua mặt trước.
        const dot = item.x * axisX + item.y * axisY + item.z * axisZ;
        const spunX = item.x * spinCos + (axisY * item.z - axisZ * item.y) * spinSin + axisX * dot * (1 - spinCos);
        const spunY = item.y * spinCos + (axisZ * item.x - axisX * item.z) * spinSin + axisY * dot * (1 - spinCos);
        const spunZ = item.z * spinCos + (axisX * item.y - axisY * item.x) * spinSin + axisZ * dot * (1 - spinCos);
        const frontness = (spunX * viewX + spunY * viewY + spunZ * viewZ) / SPHERE_RADIUS;
        const isBack = frontness < 0;
        if (isBack !== backPass) continue;

        const cameraX = spunX * rightX + spunZ * rightZ;
        const cameraY = spunX * upX + spunY * upY + spunZ * upZ;
        const depth = cameraDistance - (spunX * viewX + spunY * viewY + spunZ * viewZ);
        const perspective = cameraDistance / depth;
        projected.push({
          item,
          x: centerX + cameraX * scale * perspective,
          y: centerY + cameraY * scale * perspective,
          depth,
          perspective,
          frontness: Math.max(-1, Math.min(1, frontness))
        });
      }

      projected.sort((a, b) => b.depth - a.depth);
      for (const point of projected) {
        const item = point.item;
        const clarity = point.frontness > 0
          ? 0.82 + point.frontness * 0.18
          : 0.08 + (point.frontness + 1) * 0.20;
        const sizePerspective = point.perspective ** 2;
        ctx.globalAlpha = item.opacity * visible * clarity;

        if (item.wish) {
          const fontSize = Math.max(6, Math.min(9, scale * 1.05)) * sizePerspective;
          if (!backPass) {
            wishHitTargets.push({
              x: point.x,
              y: point.y,
              radius: Math.max(fontSize * 0.85, 18),
              wish: item.wish,
              index: sphereWishes.indexOf(item.wish)
            });
          }
          ctx.font = `600 ${fontSize}px Arial, sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillStyle = "#ffe2f2";
          ctx.shadowColor = "#ff5eb8";
          ctx.shadowBlur = (5 + point.frontness * 7) * sizePerspective;
          ctx.fillText(item.wish, point.x, point.y);
        } else if (item.butterfly) {
          const size = Math.max(9, Math.min(13, scale * 1.5)) * sizePerspective * 0.65;
          ctx.shadowColor = "#e18bff";
          ctx.shadowBlur = size * (1.2 + Math.max(0, point.frontness) * 0.9);
          drawButterfly(point.x, point.y, size, time, item.phase);
          ctx.shadowBlur = 0;
        } else if (item.sparkle) {
          const size = Math.max(10, Math.min(15, scale * 1.6)) * sizePerspective;
          const shimmer = 0.78 + (Math.sin(time * 0.003 + item.phase) + 1) * 0.11;
          ctx.globalAlpha *= shimmer;
          ctx.fillStyle = "#fff0ff";
          ctx.shadowColor = "#c69aff";
          ctx.shadowBlur = size * (1.3 + Math.max(0, point.frontness) * 1.1);
          ctx.font = `bold ${size}px Georgia, serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("✦", point.x, point.y);
        } else if (item.heart) {
          const size = Math.max(8, Math.min(12, scale * 1.3)) * sizePerspective;
          ctx.fillStyle = "#ff9bd8";
          ctx.shadowColor = "#ff42b0";
          ctx.shadowBlur = size * 0.9;
          ctx.font = `bold ${size}px Arial, sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("♥", point.x, point.y);
        }
      }
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }

    function drawRingPass(centerX, centerY, scale, visible, time, backPass, particlesToDraw = ringParticles) {
      const cosT = Math.cos(RING_TILT);
      const sinT = Math.sin(RING_TILT);
      const rotation = time * 0.00035;
      // Cộng ánh sáng giữa các hạt để chúng rực hơn mà vẫn giữ kích thước nét.
      ctx.globalCompositeOperation = "lighter";

      for (const p of particlesToDraw) {
        const angle = p.angle0 + rotation;
        const sinA = Math.sin(angle);
        const isBack = sinA < 0;
        if (backPass !== isBack) continue;

        const ex = Math.cos(angle) * p.radius;
        const ey = sinA * p.radius * RING_SQUASH;
        const rx = ex * cosT - ey * sinT;
        const ry = ex * sinT + ey * cosT;

        const px = centerX + rx * scale;
        const py = centerY + (ry + RING_Y_OFFSET) * scale;
        const depthFade = isBack ? 0.75 : 1;

        // Giữ vành đai vừa đủ rõ khi thu nhỏ, tránh các hạt quá sáng và lớn.
        const minOpacity = particlesToDraw === ringParticles ? 0.58 : 0.48;
        ctx.globalAlpha = Math.max(minOpacity, p.opacity) * visible * depthFade;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(px, py, Math.max(0.5, p.size * scale), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
    }

    function drawGreeting(centerX, centerY, heartScale, visible, retreatBuild) {
      // Lời chúc mờ dần sau lần chạm đầu tiên cùng lúc trái tim thu nhỏ.
      const fade = visible * (1 - ease(retreatBuild));
      if (fade <= 0.001) return;

      const fontSize = Math.min(52, Math.max(24, width * 0.085));
      // Nâng lời chúc lên cao hơn để tách rõ khỏi đỉnh trái tim.
      const textY = centerY - heartScale * 20 - fontSize * 1.3;
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `italic 700 ${fontSize}px "Segoe Script", "Brush Script MT", cursive`;

      const textWidth = ctx.measureText("Happy 20-10").width;
      const ornamentY = textY - fontSize * 0.68;
      ctx.shadowColor = "#8c6cff";
      ctx.shadowBlur = fontSize * 0.3;
      ctx.strokeStyle = "rgba(202, 190, 255, 0.82)";
      ctx.lineWidth = Math.max(1, fontSize * 0.025);
      ctx.beginPath();
      ctx.moveTo(centerX - textWidth * 0.34, ornamentY);
      ctx.quadraticCurveTo(centerX, ornamentY - fontSize * 0.22, centerX + textWidth * 0.34, ornamentY);
      ctx.stroke();
      ctx.fillStyle = "#e4dcff";
      ctx.font = `${fontSize * 0.28}px Arial, sans-serif`;
      ctx.fillText("✦", centerX, ornamentY - fontSize * 0.08);
      ctx.fillText("❧", centerX - textWidth * 0.4, ornamentY + fontSize * 0.02);
      ctx.fillText("❧", centerX + textWidth * 0.4, ornamentY + fontSize * 0.02);

      ctx.font = `italic 700 ${fontSize}px "Segoe Script", "Brush Script MT", cursive`;
      ctx.shadowColor = "#6846f5";
      ctx.shadowBlur = fontSize * 0.72;
      const lettering = ctx.createLinearGradient(centerX - textWidth * 0.55, textY, centerX + textWidth * 0.55, textY);
      lettering.addColorStop(0, "#a994ff");
      lettering.addColorStop(0.48, "#f5f1ff");
      lettering.addColorStop(1, "#6846f5");
      ctx.fillStyle = lettering;
      ctx.fillText("Happy 20-10", centerX, textY);
      ctx.shadowBlur = 0;
      ctx.lineWidth = Math.max(1, fontSize * 0.018);
      ctx.strokeStyle = "rgba(228, 220, 255, 0.9)";
      ctx.strokeText("Happy 20-10", centerX, textY);

      const flourishY = textY + fontSize * 0.62;
      ctx.shadowColor = "#8061f5";
      ctx.shadowBlur = fontSize * 0.3;
      ctx.strokeStyle = "rgba(180, 164, 255, 0.92)";
      ctx.lineWidth = Math.max(1, fontSize * 0.035);
      ctx.beginPath();
      ctx.moveTo(centerX - textWidth * 0.43, flourishY);
      ctx.quadraticCurveTo(centerX - textWidth * 0.18, flourishY + fontSize * 0.19, centerX, flourishY + fontSize * 0.08);
      ctx.quadraticCurveTo(centerX + textWidth * 0.18, flourishY + fontSize * 0.19, centerX + textWidth * 0.43, flourishY);
      ctx.stroke();
      ctx.fillStyle = "#d8cfff";
      ctx.font = `${fontSize * 0.28}px Arial, sans-serif`;
      ctx.fillText("✧", centerX - textWidth * 0.51, textY);
      ctx.fillText("✧", centerX + textWidth * 0.51, textY);
      ctx.restore();
    }

    function resize() {
      pixelRatio = Math.min(window.devicePixelRatio || 1, 1.25); // giới hạn độ phân giải để giảm tải vẽ yếu
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * pixelRatio;
      canvas.height = height * pixelRatio;
      ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    }

    function draw(time) {
      requestAnimationFrame(draw);
      if (time - lastFrameTime < FRAME_INTERVAL) return;
      const elapsedMs = Math.max(0, time - lastFrameTime);
      const elapsedSeconds = Math.min(0.05, elapsedMs / 1000);
      const frameScale = Math.min(2, elapsedMs / (1000 / 60));
      lastFrameTime = time;
      if (animationStartTime === null) animationStartTime = time;
      ctx.clearRect(0, 0, width, height);

      build = Math.min(1, build + 0.009 * frameScale);
      const visible = ease(build);
      // Chỉ thu nhỏ trái tim và hiện quả cầu sau lần chạm/nhấp đầu tiên.
      const retreatBuild = transitionStartTime === null
        ? 0
        : Math.max(0, Math.min(1, (time - transitionStartTime) / 2000));
      const heartZoom = 2.2 - 1.2 * ease(retreatBuild);
      // Cho quả cầu và vành đai mờ dần vào ở cuối lúc tim thu nhỏ, tránh xuất hiện đột ngột.
      const ringBuild = transitionStartTime === null
        ? 0
        : Math.max(0, Math.min(1, (time - transitionStartTime - 1650) / 2600));
      const ringVisible = ease(ringBuild);
      // Hạt trung tâm hội tụ dần từ vị trí xuất phát về đúng hình trái tim
      const formBuild = Math.min(1, (time - animationStartTime) / 2600);

      // Quả cầu tự xoay chậm, không cần giữ hay kéo màn hình.
      sphereSpinAngle += 0.08 * elapsedSeconds;
      sphereZoom += (targetSphereZoom - sphereZoom) * (1 - Math.exp(-8 * elapsedSeconds));
      // Xoay góc nhìn nhẹ khi người dùng không tương tác.
      if (!dragPointer && time - lastInteractionTime > 2500) {
        targetCameraYaw += 0.00028 * frameScale;
      }
      // Nội suy góc để chuyển động kéo và xoay tự động không bị khựng giữa các khung hình.
      const rotationEase = 1 - Math.exp(-12 * elapsedSeconds);
      cameraYaw += (targetCameraYaw - cameraYaw) * rotationEase;
      cameraPitch += (targetCameraPitch - cameraPitch) * rotationEase;
      drawSpaceBackground(time);

      const centerX = width / 2;
      const centerY = height / 2 - height * 0.05;
      // Nhịp tim đôi kiểu "lub-dub" thay vì sin đều
      const beat = Math.pow(Math.max(0, Math.sin(time * 0.0021)), 2) * 0.85
        + Math.pow(Math.max(0, Math.sin(time * 0.0021 - 0.55)), 2) * 0.35;
      const pulse = 1 + beat * 0.045;
      // Giữ toàn bộ cảnh nhỏ ngay từ đầu để tạo cảm giác đang ở xa.
      const zoomOut = 1;
      const scale = Math.min(width, height) * (width <= 600 ? 0.038 : 0.0135) * 0.5 * 0.45;
      const zoomedScale = scale * sphereZoom;
      const sphereScale = zoomedScale * 1.2 * 1.3;
      // Nhịp đập chỉ tác động lên trái tim ở giữa, không ảnh hưởng quả cầu/vành đai.
      const heartScale = scale * 1.18 * 1.2 * 0.88 * pulse * heartZoom;
      const pulseExtra = (pulse - 1) * 0.6;

      // Nền và họa tiết giữ màu bình thường; riêng các hạt dùng cộng sáng để phát quang rõ hơn.
      ctx.globalCompositeOperation = "source-over";

      if (ringVisible > 0) {
        drawSpherePass(centerX, centerY, sphereScale, ringVisible, time, true);
        drawRingPass(centerX, centerY, zoomedScale, ringVisible, time, true, outerRingParticles);
        drawRingPass(centerX, centerY, zoomedScale, ringVisible, time, true);
      }

      ctx.globalCompositeOperation = "lighter";
      for (const particle of particles) {
        particle.phase += particle.speed * frameScale;
        const sparkle = (Math.sin(particle.phase * 1.7 + time * 0.004) + 1) * 0.18;
        const twinkle = Math.max(0, Math.sin(particle.phase * 2.3 + time * 0.008));
        const chaosX = Math.sin(time * 0.0022 + particle.phase * 3.1) * (0.7 + particle.radius * 8);
        const chaosY = Math.cos(time * 0.0018 + particle.phase * 2.4) * (0.7 + particle.radius * 8);

        // Nội suy từ vị trí xuất phát (bay từ ngoài vào) tới vị trí hình tim thật
        const arriveT = Math.min(1, Math.max(0, (formBuild - (particle.arrive - 0.4)) / 0.6));
        const settle = ease(arriveT);
        const baseX = particle.startX + (particle.x - particle.startX) * settle;
        const baseY = particle.startY + (particle.y - particle.startY) * settle;

        const x = baseX * visible;
        const y = baseY * visible;
        const offsetX = (x + x * pulseExtra) * heartScale + chaosX * zoomOut;
        const offsetY = (y + y * pulseExtra) * heartScale + chaosY * zoomOut;

        ctx.globalAlpha = Math.min(1, (particle.opacity + sparkle + twinkle * 0.22) * visible);
        ctx.fillStyle = particle.color;
        ctx.beginPath();
        // Giữ hạt có kích thước tối thiểu để hình tim vẫn sáng rõ khi thu nhỏ.
        ctx.arc(centerX + offsetX, centerY + offsetY, Math.max(0.62, particle.radius * heartScale * (1 + twinkle * 0.55)), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalCompositeOperation = "source-over";

      if (ringVisible > 0) {
        drawRingPass(centerX, centerY, zoomedScale, ringVisible, time, false);
        drawRingPass(centerX, centerY, zoomedScale, ringVisible, time, false, outerRingParticles);
        drawSpherePass(centerX, centerY, sphereScale, ringVisible, time, false);
      }

      // Vẽ lời chúc sau quả cầu để chữ luôn rõ và không bị các họa tiết che mất.
      drawGreeting(centerX, centerY, heartScale, visible, retreatBuild);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
    }

    canvas.style.touchAction = "none";
    canvas.addEventListener("pointerdown", (event) => {
      lastInteractionTime = performance.now();
      activePointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      if (activePointers.size === 2) {
        const points = [...activePointers.values()];
        pinchStartDistance = Math.hypot(points[1].x - points[0].x, points[1].y - points[0].y);
        pinchStartZoom = targetSphereZoom;
        wasPinching = true;
      }
      dragPointer = {
        id: event.pointerId,
        x: event.clientX,
        y: event.clientY,
        startX: event.clientX,
        startY: event.clientY,
        startTime: performance.now(),
        moved: wasPinching
      };
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener("pointermove", (event) => {
      if (activePointers.has(event.pointerId)) {
        activePointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      }
      if (activePointers.size >= 2) {
        const points = [...activePointers.values()];
        const distance = Math.hypot(points[1].x - points[0].x, points[1].y - points[0].y);
        if (pinchStartDistance > 0) {
          targetSphereZoom = Math.max(0.65, Math.min(1.8, pinchStartZoom * distance / pinchStartDistance));
        }
        if (dragPointer) dragPointer.moved = true;
        lastInteractionTime = performance.now();
        return;
      }
      if (!dragPointer || dragPointer.id !== event.pointerId) return;
      lastInteractionTime = performance.now();
      const dx = event.clientX - dragPointer.x;
      const dy = event.clientY - dragPointer.y;
      if (Math.hypot(event.clientX - dragPointer.startX, event.clientY - dragPointer.startY) > 8) {
        dragPointer.moved = true;
      }
      targetCameraYaw += dx * 0.006;
      targetCameraPitch = Math.max(-1.1, Math.min(1.1, targetCameraPitch + dy * 0.006));
      dragPointer.x = event.clientX;
      dragPointer.y = event.clientY;
    });
    canvas.addEventListener("pointerup", (event) => {
      activePointers.delete(event.pointerId);
      lastInteractionTime = performance.now();
      if (wasPinching) {
        dragPointer = null;
        if (activePointers.size === 0) {
          wasPinching = false;
          pinchStartDistance = 0;
        }
        return;
      }
      if (!dragPointer || dragPointer.id !== event.pointerId) return;
      if (performance.now() - dragPointer.startTime > 250) dragPointer.moved = true;
      if (!dragPointer.moved) {
        if (transitionStartTime === null) {
          transitionStartTime = performance.now();
        } else {
          let closest = null;
          let closestDistance = Infinity;
          for (const target of wishHitTargets) {
            const distance = Math.hypot(event.clientX - target.x, event.clientY - target.y);
            if (distance < target.radius && distance < closestDistance) {
              closest = target;
              closestDistance = distance;
            }
          }
          if (closest) openWish(closest);
        }
      }
      dragPointer = null;
    });
    canvas.addEventListener("pointercancel", (event) => {
      activePointers.delete(event.pointerId);
      dragPointer = null;
      if (activePointers.size === 0) wasPinching = false;
    });
    canvas.addEventListener("wheel", (event) => {
      event.preventDefault();
      targetSphereZoom = Math.max(0.65, Math.min(1.8, targetSphereZoom * Math.exp(-event.deltaY * 0.001)));
      lastInteractionTime = performance.now();
    }, { passive: false });
    document.getElementById("wishClose").addEventListener("click", closeWish);
    wishModal.addEventListener("click", (event) => {
      if (event.target === wishModal) closeWish();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeWish();
    });

    resize();
    createParticles();
    createRing();
    createOuterRing();
    createSphereDecorations();
    window.addEventListener("resize", resize);
    requestAnimationFrame(draw);
  </script>
</body>
</html>
